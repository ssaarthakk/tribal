services:
  - type: web
    name: tribal-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --workspace backend --include-workspace-root && npm --workspace backend run build
    startCommand: npm --workspace backend run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
